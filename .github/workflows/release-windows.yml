name: Release Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version. Leave empty to use package.json version. If set, it must match package.json."
        required: false
        type: string
      prerelease:
        description: "Mark the draft release as a prerelease."
        required: true
        default: true
        type: boolean
      release_notes:
        description: "Optional release notes."
        required: false
        type: string

concurrency:
  group: release-windows-${{ github.ref }}-${{ inputs.version || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows release assets
    runs-on: windows-2022
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      artifact_name: ${{ steps.version.outputs.artifact_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $packageVersion = (node -p "require('./package.json').version").Trim()
          $inputVersion = "${{ inputs.version }}".Trim()
          if ($inputVersion.StartsWith("v")) {
            $inputVersion = $inputVersion.Substring(1)
          }

          if ($inputVersion) {
            if ($inputVersion -ne $packageVersion) {
              throw "Input version '$inputVersion' does not match package.json version '$packageVersion'. Update package.json first or leave version empty."
            }
            $version = $inputVersion
          } else {
            $version = $packageVersion
          }

          $tagName = "v$version"
          $artifactName = "moshu-release-windows-$tagName"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag_name=$tagName" >> $env:GITHUB_OUTPUT
          "artifact_name=$artifactName" >> $env:GITHUB_OUTPUT
          Write-Host "Release version: $version"
          Write-Host "Release tag: $tagName"

      - name: Check lockfile safety
        run: node scripts/check-lockfile-safety.mjs

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build Windows installer
        env:
          DEBUG: electron-windows-installer*
        run: npm run make:windows

      - name: Validate and checksum Windows release assets
        shell: pwsh
        run: ./scripts/stage-windows-artifacts.ps1

      - name: Upload Windows release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: out/artifacts/windows-package/**
          if-no-files-found: error
          retention-days: 30

  create-draft-release:
    name: Create draft GitHub release
    runs-on: windows-2022
    needs:
      - build-windows
    permissions:
      contents: write
    timeout-minutes: 15

    steps:
      - name: Download Windows release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-windows.outputs.artifact_name }}
          path: out/artifacts/windows-package

      - name: Ensure release does not already exist
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.build-windows.outputs.tag_name }}
        run: |
          gh release view $env:TAG_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "GitHub release '$env:TAG_NAME' already exists."
          }
          Write-Host "No existing GitHub release found for '$env:TAG_NAME'."
          exit 0

      - name: Validate downloaded release assets
        id: assets
        shell: pwsh
        run: |
          $artifactRoot = Join-Path $PWD "out\artifacts\windows-package"
          if (-not (Test-Path $artifactRoot)) {
            throw "Downloaded Windows release artifact directory was not created: $artifactRoot"
          }

          $artifactRootPath = (Resolve-Path $artifactRoot).Path
          $installers = @(Get-ChildItem $artifactRootPath -File -Filter "*.exe")
          $packages = @(Get-ChildItem $artifactRootPath -File -Filter "*.nupkg")
          $releaseIndexes = @(Get-ChildItem $artifactRootPath -File -Filter "RELEASES")
          $zips = @(Get-ChildItem $artifactRootPath -File -Filter "*.zip")
          $checksums = @(Get-ChildItem $artifactRootPath -File -Filter "SHA256SUMS.txt")

          $hasCompleteSquirrelSet = $installers.Count -ge 1 -and $packages.Count -ge 1 -and $releaseIndexes.Count -eq 1
          if ($zips.Count -lt 1 -and -not $hasCompleteSquirrelSet) {
            throw "Downloaded Windows release assets must include either a portable .zip or a complete Squirrel set (.exe, .nupkg, RELEASES)."
          }
          if ($checksums.Count -ne 1) {
            throw "Downloaded Windows release assets must include exactly one SHA256SUMS.txt file."
          }

          $releaseAssets = @(Get-ChildItem $artifactRootPath -File | Sort-Object FullName)
          $assetListPath = Join-Path $PWD "release-assets.txt"
          $releaseAssets.FullName | Set-Content -Path $assetListPath -Encoding utf8
          "asset_list=$assetListPath" >> $env:GITHUB_OUTPUT

          Write-Host "Windows release assets:"
          $releaseAssets | ForEach-Object { Write-Host "- $($_.Name)" }

      - name: Write release notes
        shell: pwsh
        env:
          TAG_NAME: ${{ needs.build-windows.outputs.tag_name }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          $notesPath = Join-Path $PWD "release-notes.md"
          if ($env:RELEASE_NOTES.Trim()) {
            $env:RELEASE_NOTES | Set-Content -Path $notesPath -Encoding utf8
          } else {
            @(
              "# 墨枢 $env:TAG_NAME"
              ""
              "Windows 安装包。"
            ) | Set-Content -Path $notesPath -Encoding utf8
          }

      - name: Create draft GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.build-windows.outputs.tag_name }}
          PRERELEASE: ${{ inputs.prerelease }}
          ASSET_LIST: ${{ steps.assets.outputs.asset_list }}
        run: |
          $assets = @(Get-Content $env:ASSET_LIST | Where-Object { $_.Trim() })
          if ($assets.Count -eq 0) {
            throw "No release assets were found."
          }

          $ghArgs = @(
            "release", "create", $env:TAG_NAME
          )
          $ghArgs += $assets
          $ghArgs += @(
            "--draft",
            "--title", "墨枢 $env:TAG_NAME",
            "--notes-file", "release-notes.md",
            "--target", "${{ github.sha }}"
          )
          if ($env:PRERELEASE -eq "true") {
            $ghArgs += "--prerelease"
          }

          gh @ghArgs
