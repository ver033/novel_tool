name: Package Windows

on:
  workflow_dispatch:

concurrency:
  group: package-windows-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package-windows:
    name: Package Windows installer
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Check lockfile safety
        run: node scripts/check-lockfile-safety.mjs

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build Windows installer
        run: npm run make:windows

      - name: Validate Windows package output
        shell: pwsh
        run: ./scripts/stage-windows-artifacts.ps1

      - name: Upload Windows package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moshu-windows-${{ github.run_number }}
          path: out/artifacts/windows-package/**
          if-no-files-found: error
          retention-days: 14
