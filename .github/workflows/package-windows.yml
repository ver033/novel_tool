name: Package Windows

on:
  workflow_dispatch:

concurrency:
  group: package-windows-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package-windows:
    name: Package Windows installer
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Check lockfile safety
        run: node scripts/check-lockfile-safety.mjs

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build Windows installer
        run: npm run make

      - name: Validate Windows package output
        shell: pwsh
        run: |
          $makeRoot = Join-Path $PWD "out\make"
          if (-not (Test-Path $makeRoot)) {
            throw "Expected Electron Forge make output directory was not created: $makeRoot"
          }

          $installers = @(Get-ChildItem $makeRoot -Recurse -File -Filter "*.exe")
          $packages = @(Get-ChildItem $makeRoot -Recurse -File -Filter "*.nupkg")
          $releaseIndexes = @(Get-ChildItem $makeRoot -Recurse -File -Filter "RELEASES")

          if ($installers.Count -lt 1) {
            throw "Windows installer .exe was not found under $makeRoot"
          }
          if ($packages.Count -lt 1) {
            throw "Squirrel .nupkg package was not found under $makeRoot"
          }
          if ($releaseIndexes.Count -lt 1) {
            throw "Squirrel RELEASES index was not found under $makeRoot"
          }

          $artifactRoot = Join-Path $PWD "out\artifacts\windows-package"
          if (Test-Path $artifactRoot) {
            Remove-Item $artifactRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null

          $assetFiles = @($installers + $packages + $releaseIndexes) | Sort-Object FullName -Unique
          $duplicateNames = @($assetFiles | Group-Object Name | Where-Object { $_.Count -gt 1 })
          if ($duplicateNames.Count -gt 0) {
            $names = ($duplicateNames | ForEach-Object { $_.Name }) -join ", "
            throw "Duplicate Windows artifact file names would collide in staging: $names"
          }

          foreach ($file in $assetFiles) {
            Copy-Item $file.FullName -Destination (Join-Path $artifactRoot $file.Name) -Force
          }

          $artifactRootPath = (Resolve-Path $artifactRoot).Path
          $artifactFiles = @(Get-ChildItem $artifactRootPath -File | Sort-Object FullName)
          $checksumPath = Join-Path $artifactRootPath "SHA256SUMS.txt"
          $checksums = foreach ($file in $artifactFiles) {
            $relativePath = $file.FullName.Substring($artifactRootPath.Length + 1).Replace("\", "/")
            $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant()
            "$hash  $relativePath"
          }
          $checksums | Set-Content -Path $checksumPath -Encoding ascii

          Write-Host "Windows package artifacts:"
          Get-ChildItem $artifactRootPath -File |
            Sort-Object FullName |
            ForEach-Object { Write-Host "- $($_.Name)" }

      - name: Upload Windows package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moshu-windows-${{ github.run_number }}
          path: out/artifacts/windows-package/**
          if-no-files-found: error
          retention-days: 14
